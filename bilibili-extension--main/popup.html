<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles/shared.css">
  <style>
    /* ── 弹窗布局（特有样式） ── */
    html { background: var(--bg); }
    body {
      width: 520px; min-height: 300px; max-height: 660px;
      overflow-y: auto; overflow-x: hidden;
      border-radius: 16px;
      background-image:
        radial-gradient(600px 300px at 90% -20%, rgba(124,92,255,.18) 0%, transparent 60%),
        radial-gradient(400px 200px at -10% 110%, rgba(0,200,255,.10) 0%, transparent 55%);
    }
    .inner { padding: 14px; }

    /* 头部 */
    .header {
      padding: 13px 16px 11px;
      background: linear-gradient(120deg, rgba(0,200,255,.14), rgba(124,92,255,.10));
      border-bottom: 1px solid var(--card-border);
      display: flex; align-items: center; gap: 10px;
      border-radius: 16px 16px 0 0;
      position: sticky; top: 0; z-index: 10;
      backdrop-filter: blur(6px);
    }
    .logo {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      background: var(--accent-grad);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 800; color: #fff;
      box-shadow: 0 3px 14px rgba(0,200,255,.35);
    }
    .header h1 {
      font-size: 15px; font-weight: 700; flex: 1; line-height: 1.25;
      background: linear-gradient(90deg, #fff, #bcd);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .header small { font-size: 11px; color: var(--text-dim); font-weight: 400; margin-left: 4px; }
    .icon-btn {
      color: var(--text-dim); text-decoration: none; font-size: 17px;
      padding: 4px; border-radius: 6px; transition: all .2s; line-height: 1;
    }
    .icon-btn:hover { color: var(--accent); background: rgba(0,200,255,.1); }

    /* 运行状态点 */
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
      background: #3a4266; box-shadow: 0 0 0 3px rgba(58,66,102,.25);
      transition: all .3s;
    }
    .status-dot.running {
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,200,255,.2), 0 0 10px var(--accent);
      animation: dot-pulse 1.6s ease infinite;
    }
    @keyframes dot-pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

    /* 任务卡片网格 */
    .task-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .task-card {
      border: 1px solid var(--card-border); border-radius: 10px;
      padding: 10px 8px 8px; text-align: center; cursor: pointer;
      background: rgba(255,255,255,.02);
      transition: border-color .2s, transform .12s, background .2s;
      user-select: none;
    }
    .task-card:hover { border-color: #3a4a7d; background: rgba(255,255,255,.05); }
    .task-card:active { transform: scale(.97); }
    .task-card.on { border-color: var(--accent); background: rgba(0,200,255,.06); }
    .task-icon { font-size: 20px; line-height: 1.2; }
    .task-name { font-size: 12px; color: var(--text); margin: 4px 0 6px; font-weight: 600; }
    .task-card .switch { justify-content: center; }

    /* 附加功能 chips */
    .chips { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 10px; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border: 1px solid var(--card-border); border-radius: 999px;
      font-size: 11px; color: var(--text-dim); cursor: pointer;
      background: rgba(255,255,255,.03); transition: all .2s; user-select: none;
    }
    .chip:hover { border-color: var(--accent); color: var(--text); }
    .chip.off { opacity: .4; }
    .chip input { display: none; }
    .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #3a4266; transition: background .2s; }
    .chip.on .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
    .chip.on { color: var(--text); border-color: #2e3a63; }

    /* 高级参数折叠 */
    details.advanced { margin-top: 10px; }
    details.advanced summary {
      font-size: 11px; color: var(--text-dim); cursor: pointer;
      padding: 3px 0; user-select: none; list-style: none;
      display: flex; align-items: center; gap: 4px; transition: color .2s;
    }
    details.advanced summary::-webkit-details-marker { display: none; }
    details.advanced summary::before { content: '▸ '; transition: transform .2s; }
    details.advanced[open] summary::before { transform: rotate(90deg); }
    details.advanced summary:hover { color: var(--accent); }
    .advanced-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--card-border);
    }
    .adv-field { display: flex; flex-direction: column; gap: 4px; }
    .adv-field > span { font-size: 11px; color: var(--text-dim); }
    .adv-field input[type="number"] { width: 100%; text-align: center; padding: 5px 6px; font-size: 12px; }
    .adv-field select { width: 100%; padding: 5px 6px; font-size: 12px; }
    .adv-full { grid-column: 1 / -1; }

    /* 主按钮 */
    .btn-start {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: var(--accent-grad); color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: opacity .2s, transform .1s, box-shadow .2s;
      box-shadow: 0 5px 18px rgba(0,200,255,.3);
      font-family: inherit;
    }
    .btn-start:hover { opacity: .88; }
    .btn-start:active { transform: scale(.99); }
    .btn-start:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

    /* 进度 */
    .progress-wrap {
      height: 7px; background: #1a2138; border-radius: 4px;
      overflow: hidden; margin-bottom: 6px; display: none;
    }
    .progress-wrap.show { display: block; }
    .progress-bar {
      height: 100%; width: 0; border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      background-size: 200% 100%; animation: flow 2s linear infinite;
      transition: width .3s;
    }
    @keyframes flow { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .progress-text { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; display: none; }
    .progress-text.show { display: block; }

    /* 结果面板 */
    .result-panel {
      border: 1px solid var(--card-border); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 10px; display: none;
      background: rgba(20,26,46,.6);
    }
    .result-panel.show { display: block; animation: fadein .25s ease; }
    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .result-panel h3 {
      font-size: 12px; color: var(--accent); margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .result-panel h3 .flex { flex: 1; }
    .cloud-box { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
    .cloud-box span { cursor: default; color: #bcd; }
    .up-line { font-size: 13px; color: #ddd; line-height: 1.6; }
    .summary-body {
      max-height: 150px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
      font-size: 12px; line-height: 1.65; color: #ccc;
      background: rgba(0,0,0,.25); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
    }
    details.think { margin-bottom: 6px; }
    details.think summary {
      font-size: 11px; color: var(--text-dim); cursor: pointer; user-select: none;
    }
    details.think summary:hover { color: var(--accent); }
    .think-body { max-height: 110px; color: #9aa3c7; font-style: italic; margin-bottom: 0; }

    /* 日志 */
    details.log-card summary {
      font-size: 11px; color: var(--text-dim); cursor: pointer;
      user-select: none; list-style: none; display: flex; align-items: center; gap: 6px;
    }
    details.log-card summary::-webkit-details-marker { display: none; }
    details.log-card summary::before { content: '▸ '; transition: transform .2s; }
    details.log-card[open] summary::before { transform: rotate(90deg); }
    details.log-card summary:hover { color: var(--accent); }
    details.log-card summary .flex { flex: 1; }
    .log-box {
      background: rgba(0,0,0,.3); border: 1px solid var(--card-border); border-radius: 10px;
      padding: 10px; height: 140px; overflow-y: auto;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all;
      margin-top: 8px;
    }
    .log-box .log-progress { color: #8b93b5; }
    .log-box .log-success { color: var(--ok); }
    .log-box .log-error { color: var(--err); }
    .log-box .log-info { color: var(--accent); }

    .download-area { margin-top: 4px; }
    .download-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border: 1px solid var(--card-border); border-radius: 8px;
      background: rgba(0,200,255,.06); color: var(--accent);
      font-size: 12px; cursor: pointer; margin: 3px; transition: all .2s; font-family: inherit;
    }
    .download-btn:hover { border-color: var(--accent); background: rgba(0,200,255,.14); }

    .dl-toolbar { display: flex; align-items: center; gap: 8px; margin: 6px 2px 0; }
    .dl-toolbar .hint { margin-top: 0; flex: 1; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">B</div>
    <h1>B站数据爬取工具 <small id="version-tag"></small></h1>
    <span class="status-dot" id="status-dot" title="任务状态"></span>
    <button class="icon-btn" id="btn-preview" title="切换到预览版（玻璃拟态 + 动效）" style="border:none;background:transparent;cursor:pointer">✨</button>
    <a id="btn-settings" href="#" title="设置" class="icon-btn">⚙️</a>
  </div>

  <div class="inner">
    <div class="card">
      <div class="card-title">视频</div>
      <div class="row" style="display:flex;gap:8px;align-items:center">
        <input type="text" id="bvid" placeholder="BV号 或完整链接（B站视频页自动识别）" style="flex:1" />
        <button class="btn" id="btn-copy-bvid" title="复制当前BV号">📋 复制</button>
      </div>
      <div class="hint" id="auto-detect-hint"></div>
    </div>

    <details class="card" id="sec-batch" style="padding:10px 14px">
      <summary style="font-size:12px;color:var(--text-dim);cursor:pointer;user-select:none;list-style:none">
        📚 批量模式：粘贴多个 BV 号 / 链接（每行一个）
      </summary>
      <textarea id="batch-list" placeholder="BV1xxxxxxxxxx&#10;https://www.bilibili.com/video/BV1yyyyyyyyyy&#10;..." style="margin-top:6px"></textarea>
      <div class="hint">填写后按列表顺序逐个抓取，可配合单 BV 输入合并</div>
    </details>

    <div class="card" id="sec-tasks">
      <div class="card-title">任务 <span style="flex:1"></span>
        <button class="btn-mini" id="btn-select-all" title="一键勾选全部任务与可选功能">🪄 全选</button>
      </div>

      <!-- 主任务：三张任务卡 -->
      <div class="task-grid">
        <div class="task-card" id="task-card-dm">
          <div class="task-icon">📺</div>
          <div class="task-name">弹幕</div>
          <label class="switch"><input type="checkbox" id="chk-danmaku" checked><span class="track"></span></label>
        </div>
        <div class="task-card" id="task-card-cm">
          <div class="task-icon">💬</div>
          <div class="task-name">评论</div>
          <label class="switch"><input type="checkbox" id="chk-comments"><span class="track"></span></label>
        </div>
        <div class="task-card" id="task-card-sub">
          <div class="task-icon">📄</div>
          <div class="task-name">字幕</div>
          <label class="switch"><input type="checkbox" id="chk-subtitle"><span class="track"></span></label>
        </div>
      </div>

      <!-- 附加功能（chip 形态，保留 opt-* 包裹 id 供显隐联动） -->
      <div class="chips" id="row-opts">
        <label class="chip" id="opt-cloud"><input type="checkbox" id="chk-cloud"><span class="dot"></span>☁️ 热词</label>
        <label class="chip" id="opt-up"><input type="checkbox" id="chk-up"><span class="dot"></span>👤 UP主</label>
        <label class="chip" id="opt-ai"><input type="checkbox" id="chk-ai"><span class="dot"></span>🤖 AI总结</label>
        <label class="chip" id="opt-ai-dm"><input type="checkbox" id="chk-ai-dm"><span class="dot"></span>🧠 AI弹幕</label>
        <label class="chip" id="opt-ai-cm"><input type="checkbox" id="chk-ai-cm"><span class="dot"></span>💬🧠 AI评论</label>
        <label class="chip"><input type="checkbox" id="chk-replies"><span class="dot"></span>↳ 楼中楼</label>
      </div>

      <!-- 高级参数（折叠） -->
      <details class="advanced" id="row-advanced">
        <summary>⚙️ 高级参数（页数 / 滑动窗口 / 速率 / 语言 / 格式）</summary>
        <div class="advanced-grid">
          <div class="adv-field">
            <span>目标页数（0=全部）</span>
            <input type="number" id="max-pages" value="0" min="0" title="0=全部">
          </div>
          <div class="adv-field">
            <span>评论条数上限（0=不限）</span>
            <input type="number" id="max-comments" value="0" min="0" title="评论条数上限（滑动窗口），0=不限">
          </div>
          <div class="adv-field">
            <span>翻页间隔 ms（防风控）</span>
            <input type="number" id="rate-delay" value="400" min="100" step="50" title="评论翻页间隔（毫秒）">
          </div>
          <div class="adv-field">
            <span>字幕语言</span>
            <select id="sub-lan">
              <option value="ai-zh">中文AI</option>
              <option value="zh-Hans">简体</option>
              <option value="zh-Hant">繁体</option>
              <option value="en">英语</option>
              <option value="ja">日语</option>
              <option value="ko">韩语</option>
            </select>
          </div>
          <div class="adv-field adv-full">
            <span>导出格式</span>
            <select id="save-fmt">
              <option value="json">JSON</option>
              <option value="csv">CSV</option>
              <option value="txt">TXT</option>
              <option value="srt">SRT</option>
              <option value="ass">ASS</option>
              <option value="lrc">LRC</option>
            </select>
          </div>
        </div>
      </details>
    </div>

    <div class="card" id="sec-cookie">
      <div class="card-title">Cookie</div>
      <div class="row" style="display:flex;gap:8px;align-items:center">
        <input type="password" id="cookie" placeholder="SESSDATA=xxx; bili_jct=yyy" style="flex:1" />
        <button class="btn" id="btn-read-cookie" title="从浏览器读取当前B站登录Cookie并填入">🍪 读取</button>
      </div>
      <div class="hint" id="cookie-status"></div>
    </div>

    <button class="btn-start" id="btn-start">🚀 开始爬取</button>
    <button class="btn-cancel" id="btn-cancel" style="display:none">⛔ 取消</button>

    <div style="margin-top:12px">
      <div class="progress-wrap" id="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="progress-text" id="progress-text"></div>

      <div class="result-panel" id="panel-up">
        <h3>👤 UP 主信息 <span class="flex"></span></h3>
        <div class="up-line" id="up-info"></div>
      </div>

      <div class="result-panel" id="panel-cloud">
        <h3>☁️ 弹幕热词 <span class="flex"></span><button class="btn-mini" id="btn-cloud-copy">📋 复制</button></h3>
        <div class="cloud-box" id="cloud-box"></div>
      </div>

      <div class="result-panel" id="panel-summary">
        <h3>🤖 AI 字幕总结 <span class="flex"></span><button class="btn-mini" id="btn-summary-copy">📋 复制</button></h3>
        <details class="think" id="summary-think" style="display:none"><summary>🤔 思考过程</summary><div class="summary-body think-body" id="summary-think-body"></div></details>
        <div class="summary-body" id="summary-body"></div>
      </div>

      <div class="result-panel" id="panel-ai-dm">
        <h3>🧠 AI 弹幕分析 <span class="flex"></span><button class="btn-mini" id="btn-ai-dm-copy">📋 复制</button></h3>
        <details class="think" id="ai-dm-think" style="display:none"><summary>🤔 思考过程</summary><div class="summary-body think-body" id="ai-dm-think-body"></div></details>
        <div class="summary-body" id="ai-dm-body"></div>
      </div>

      <div class="result-panel" id="panel-ai-cm">
        <h3>💬🧠 AI 评论分析 <span class="flex"></span><button class="btn-mini" id="btn-ai-cm-copy">📋 复制</button></h3>
        <details class="think" id="ai-cm-think" style="display:none"><summary>🤔 思考过程</summary><div class="summary-body think-body" id="ai-cm-think-body"></div></details>
        <div class="summary-body" id="ai-cm-body"></div>
      </div>

      <details class="card log-card">
        <summary>运行日志 <span class="flex"></span><button class="btn-mini" id="btn-clear-log">🗑️ 清空</button></summary>
        <div class="log-box" id="log"></div>
      </details>

      <div class="dl-toolbar">
        <span class="hint" id="dl-hint">输出文件将保存到浏览器下载目录</span>
        <button class="btn-mini" id="btn-clear-dl">🗑️ 清空文件</button>
      </div>
      <div class="download-area" id="download-area"></div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>

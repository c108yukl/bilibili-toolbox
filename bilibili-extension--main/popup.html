<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0b0e1a;
      --card: #141a2e;
      --card-border: #232c4a;
      --text: #e6e9f5;
      --text-dim: #8b93b5;
      --accent: #00c8ff;
      --accent2: #7c5cff;
      --ok: #4caf50;
      --warn: #ff9800;
      --err: #f44336;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      width: 500px; min-height: 300px; max-height: 640px;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px; background: var(--bg); color: var(--text);
      padding: 0; overflow-y: auto;
      border-radius: 16px; overflow: hidden;
      background-image: radial-gradient(600px 300px at 90% -20%, rgba(124,92,255,.18) 0%, transparent 60%);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    .inner { padding: 16px; }
    /* 头部 */
    .header {
      padding: 14px 16px 12px;
      background: linear-gradient(120deg, rgba(0,200,255,.14), rgba(124,92,255,.10));
      border-bottom: 1px solid var(--card-border);
      display: flex; align-items: center; gap: 10px;
      border-radius: 16px 16px 0 0;
    }    .logo {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 800; color: #fff;
      box-shadow: 0 3px 14px rgba(0,200,255,.35);
    }
    .header h1 { font-size: 16px; font-weight: 700; flex: 1;
      background: linear-gradient(90deg, #fff, #bcd); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .header small { font-size: 11px; color: var(--text-dim); font-weight: 400; margin-left: 6px; }
    .icon-btn { color: var(--text-dim); text-decoration: none; font-size: 17px; padding: 4px; border-radius: 6px; transition: all .2s; }
    .icon-btn:hover { color: var(--accent); background: rgba(0,200,255,.1); }
    /* 卡片 */
    .card {
      background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
      padding: 12px 14px; margin-bottom: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
    }
    .card-title { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .card-title::before { content: ''; width: 3px; height: 10px; border-radius: 2px;
      background: linear-gradient(180deg, var(--accent), var(--accent2)); }
    input[type="text"], input[type="password"], select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--card-border); border-radius: 8px;
      background: rgba(0,0,0,.3); color: var(--text); font-size: 13px; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,200,255,.12); }
    textarea {
      width: 100%; min-height: 60px; padding: 8px 10px; border: 1px solid var(--card-border); border-radius: 8px;
      background: rgba(0,0,0,.3); color: var(--text); font-size: 12px; outline: none; resize: vertical;
      font-family: 'Consolas', monospace; line-height: 1.5;
    }
    .hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row + .row { margin-top: 8px; }
    /* 开关 */
    .switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .switch input { display: none; }
    .switch .track { width: 34px; height: 19px; background: #2a3350; border-radius: 10px;
      position: relative; transition: background .25s; flex-shrink: 0; }
    .switch .track::after { content: ''; position: absolute; top: 2.5px; left: 2.5px; width: 14px; height: 14px;
      border-radius: 50%; background: #8b93b5; transition: all .25s; }
    .switch input:checked + .track { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .switch input:checked + .track::after { left: 17.5px; background: #fff; }
    .switch .lbl { font-size: 12px; color: var(--text); }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .badge-dm { background: rgba(33,150,243,.25); color: #6db9ff; }
    .badge-cm { background: rgba(255,152,0,.25); color: #ffb74d; }
    .badge-sub { background: rgba(156,39,176,.3); color: #ce93d8; }
    .badge-cloud { background: rgba(0,150,136,.3); color: #4db6ac; }
    .badge-up { background: rgba(96,125,139,.3); color: #90a4ae; }
    .badge-ai { background: rgba(233,30,99,.3); color: #f06292; }
    .opt-hide { opacity: .35; }
    .inl { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-dim); }
    .inl input[type="number"] { width: 60px; padding: 5px 6px; border: 1px solid var(--card-border); border-radius: 6px;
      background: rgba(0,0,0,.3); color: var(--text); font-size: 12px; text-align: center; }
    .inl select { width: auto; min-width: 92px; padding: 5px 6px; font-size: 12px; }
    details.batch summary { font-size: 12px; color: var(--text-dim); cursor: pointer; padding: 2px 0; list-style: none; }
    details.batch summary:hover { color: var(--accent); }
    details.batch summary::before { content: '▸ '; }
    details.batch[open] summary::before { content: '▾ '; }
    details.batch textarea { margin-top: 6px; }
    /* 按钮 */
    .btn-start {
      width: 100%; padding: 11px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity .2s, transform .1s;
      box-shadow: 0 5px 18px rgba(0,200,255,.3);
    }
    .btn-start:hover { opacity: .88; }
    .btn-start:active { transform: scale(.99); }
    .btn-start:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
    .btn-cancel {
      width: 100%; padding: 8px; border: 1px solid #444; border-radius: 8px;
      background: transparent; color: #ccc; font-size: 13px; cursor: pointer; margin-top: 6px;
    }
    .btn-cancel:hover { background: rgba(255,255,255,.05); }
    .btn-mini {
      padding: 3px 10px; border: 1px solid var(--card-border); border-radius: 6px;
      background: rgba(255,255,255,.04); color: var(--accent); font-size: 12px; cursor: pointer; margin: 2px;
      transition: all .2s;
    }
    .btn-mini:hover { border-color: var(--accent); background: rgba(0,200,255,.1); }
    .btn-cookie {
      padding: 6px 12px; border: 1px solid var(--card-border); border-radius: 8px;
      background: rgba(255,255,255,.04); color: #ccc; font-size: 12px; cursor: pointer; transition: all .2s;
    }
    .btn-cookie:hover { border-color: var(--accent); color: var(--accent); }
    /* 进度 */
    .progress-wrap { height: 7px; background: #1a2138; border-radius: 4px; overflow: hidden; margin-bottom: 6px; display: none; }
    .progress-wrap.show { display: block; }
    .progress-bar { height: 100%; width: 0; border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      background-size: 200% 100%; animation: flow 2s linear infinite; transition: width .3s; }
    @keyframes flow { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .progress-text { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; display: none; }
    .progress-text.show { display: block; }
    /* 结果面板 */
    .result-panel { border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px;
      margin-bottom: 10px; display: none; background: rgba(20,26,46,.6); }
    .result-panel.show { display: block; animation: fadein .25s ease; }
    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .result-panel h3 { font-size: 12px; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .result-panel h3 .flex { flex: 1; }
    .cloud-box { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
    .cloud-box span { cursor: default; color: #bcd; }
    .up-line { font-size: 13px; color: #ddd; line-height: 1.6; }
    .summary-body {
      max-height: 150px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
      font-size: 12px; line-height: 1.65; color: #ccc; background: rgba(0,0,0,.25);
      border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
    }
    /* 日志 */
    .log-box {
      background: rgba(0,0,0,.3); border: 1px solid var(--card-border); border-radius: 10px;
      padding: 10px; height: 150px; overflow-y: auto; font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all;
    }
    .log-box .log-progress { color: #8b93b5; }
    .log-box .log-success { color: var(--ok); }
    .log-box .log-error { color: var(--err); }
    .log-box .log-info { color: var(--accent); }
    .download-area { margin-top: 4px; }
    .download-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border: 1px solid var(--card-border); border-radius: 8px;
      background: rgba(0,200,255,.06); color: var(--accent); font-size: 12px; cursor: pointer;
      margin: 3px; transition: all .2s;
    }
    .download-btn:hover { border-color: var(--accent); background: rgba(0,200,255,.14); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">B</div>
    <h1>B站数据爬取工具 <small id="version-tag">v2.4.0</small></h1>
    <a id="btn-settings" href="#" title="设置" class="icon-btn">⚙️</a>
  </div>

  <div class="inner">
    <div class="card">
      <div class="card-title">视频</div>
      <div class="row">
        <input type="text" id="bvid" placeholder="BV号 或完整链接（B站视频页自动识别）" style="flex:1" />
        <button class="btn-cookie" id="btn-copy-bvid" title="复制当前BV号">📋 复制</button>
      </div>
      <div class="hint" id="auto-detect-hint"></div>
    </div>

    <details class="batch card" id="sec-batch" style="padding:10px 14px">
      <summary>📚 批量模式：粘贴多个 BV 号 / 链接（每行一个）</summary>
      <textarea id="batch-list" placeholder="BV1xxxxxxxxxx&#10;https://www.bilibili.com/video/BV1yyyyyyyyyy&#10;..."></textarea>
      <div class="hint">填写后按列表顺序逐个抓取，可配合单 BV 输入合并</div>
    </details>

    <div class="card" id="sec-tasks">
      <div class="card-title">任务 <span style="flex:1"></span>
        <button class="btn-mini" id="btn-select-all" title="一键勾选全部任务与可选功能">🪄 全选</button>
      </div>
      <div class="row">
        <label class="switch"><input type="checkbox" id="chk-danmaku" checked><span class="track"></span><span class="lbl"><span class="badge badge-dm">弹幕</span></span></label>
        <label class="switch"><input type="checkbox" id="chk-comments"><span class="track"></span><span class="lbl"><span class="badge badge-cm">评论</span></span></label>
        <label class="switch"><input type="checkbox" id="chk-subtitle"><span class="track"></span><span class="lbl"><span class="badge badge-sub">字幕</span></span></label>
      </div>
      <div class="row" id="row-opts" style="margin-top:10px">
        <label id="opt-cloud" class="switch opt-hide"><input type="checkbox" id="chk-cloud"><span class="track"></span><span class="lbl"><span class="badge badge-cloud">☁️ 热词</span></span></label>
        <label id="opt-up" class="switch"><input type="checkbox" id="chk-up"><span class="track"></span><span class="lbl"><span class="badge badge-up">👤 UP主</span></span></label>
        <label id="opt-ai" class="switch opt-hide"><input type="checkbox" id="chk-ai"><span class="track"></span><span class="lbl"><span class="badge badge-ai">🤖 AI总结</span></span></label>
        <label id="opt-ai-dm" class="switch opt-hide"><input type="checkbox" id="chk-ai-dm"><span class="track"></span><span class="lbl"><span class="badge badge-ai">🧠 AI弹幕</span></span></label>
        <label class="switch"><input type="checkbox" id="chk-replies"><span class="track"></span><span class="lbl">楼中楼</span></label>
      </div>
      <div class="row" id="row-advanced" style="margin-top:10px">
        <span class="inl">页数 <input type="number" id="max-pages" value="0" min="0" title="0=全部"></span>
        <span class="inl">字幕
          <select id="sub-lan">
            <option value="ai-zh">中文AI</option>
            <option value="zh-Hans">简体</option>
            <option value="zh-Hant">繁体</option>
            <option value="en">英语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
          </select>
        </span>
        <span class="inl">格式
          <select id="save-fmt">
            <option value="json">JSON</option>
            <option value="csv">CSV</option>
            <option value="txt">TXT</option>
            <option value="md">MD</option>
            <option value="srt">SRT</option>
            <option value="ass">ASS</option>
            <option value="lrc">LRC</option>
          </select>
        </span>
      </div>
    </div>

    <div class="card" id="sec-cookie">
      <div class="card-title">Cookie</div>
      <div class="row">
        <input type="password" id="cookie" placeholder="SESSDATA=xxx; bili_jct=yyy" style="flex:1" />
        <button class="btn-cookie" id="btn-read-cookie" title="从浏览器读取当前B站登录Cookie并填入">🍪 读取</button>
      </div>
      <div class="hint" id="cookie-status"></div>
    </div>

    <button class="btn-start" id="btn-start">🚀 开始爬取</button>
    <button class="btn-cancel" id="btn-cancel" style="display:none">⛔ 取消</button>

    <div style="margin-top:12px">
      <div class="progress-wrap" id="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="progress-text" id="progress-text"></div>

      <div class="result-panel" id="panel-up">
        <h3>👤 UP 主信息 <span class="flex"></span></h3>
        <div class="up-line" id="up-info"></div>
      </div>

      <div class="result-panel" id="panel-cloud">
        <h3>☁️ 弹幕热词 <span class="flex"></span><button class="btn-mini" id="btn-cloud-copy">📋 复制</button></h3>
        <div class="cloud-box" id="cloud-box"></div>
      </div>

      <div class="result-panel" id="panel-summary">
        <h3>🤖 AI 字幕总结 <span class="flex"></span><button class="btn-mini" id="btn-summary-copy">📋 复制</button></h3>
        <div class="summary-body" id="summary-body"></div>
      </div>

      <div class="result-panel" id="panel-ai-dm">
        <h3>🧠 AI 弹幕分析 <span class="flex"></span><button class="btn-mini" id="btn-ai-dm-copy">📋 复制</button></h3>
        <div class="summary-body" id="ai-dm-body"></div>
      </div>

      <div class="card">
        <div class="card-title">运行日志</div>
        <div class="log-box" id="log"></div>
      </div>

      <div class="download-area" id="download-area"></div>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
